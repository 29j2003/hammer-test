# CI in three jobs:
#   checks  - privacy (no e-mail addresses or secrets, commits only with noreply addresses)
#   linux   - build, unit tests, UI tests under Xvfb (Mesa), screenshots of the demo map
#   windows - build with MSVC + Qt 6.8, unit tests, package the editor as a zip
# All actions are pinned to commit SHAs (Dependabot keeps them current).
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the privacy check also looks at commit addresses
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Privacy (no e-mail addresses or secrets)
        run: python -I tools/check_privacy.py

  linux:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Packages (Qt 6, Mesa, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev libgl1-mesa-dev libgl1-mesa-dri xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure -LE ui
      - name: UI tests (simulated mouse in the real window)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build --output-on-failure -L ui
      - name: Screenshots of the demo map
        run: |
          build/tests/sme-make-fixture demo > /dev/null
          map=demo/Steam/steamapps/sourcemods/mymod/mapsrc/demo.vmf
          shot() { HOME="$PWD/home" xvfb-run -a -s "-screen 0 1920x1080x24" build/src/app/SourceMapEditor --steam demo/Steam --game sourcemods/mymod "$map" "$@"; }
          mkdir -p screenshots home
          shot --camera "-470 -470 230 45 -18" --select-class npc_citizen --screenshot screenshots/npc.png --wait 6000
          shot --quad --camera "-470 -470 230 45 -18" --select-class trigger_once --screenshot screenshots/quad.png --wait 6000
          shot --camera "-470 -470 230 45 -18" --check --dock Problems --screenshot screenshots/problems.png --wait 8000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

  windows:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Qt 6.8
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          aqtversion: "==3.3.0"
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure -LE ui
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $out = "dist/SourceMapEditor-$version-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/src/app/Release/SourceMapEditor.exe $out
          Copy-Item build/src/probe/Release/sme-probe.exe $out
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.txt $out
          Copy-Item build/_deps/sourcepp-src/LICENSE "$out/LICENSE_sourcepp.txt"
          Copy-Item build/_deps/sourcepp-src/THIRDPARTY_LEGAL_NOTICES.txt "$out/THIRD_PARTY_NOTICES_sourcepp.txt"
          # windeployqt adds the Qt DLLs (and opengl32sw.dll, a software OpenGL fallback).
          windeployqt --release --no-translations --no-system-d3d-compiler "$out/SourceMapEditor.exe"
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
          (Get-FileHash "$out.zip" -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path "$out.zip" -Leaf) | Out-File -Encoding ascii "$out.zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SourceMapEditor-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 30
