# Release: pushing a tag "v1.2.3" builds the Windows package and publishes it as a GitHub
# release with a SHA-256 checksum. The editor's update check reads the newest release.
# The tag must match the VERSION file (checked below). The tag may also come from a release drafted
# on github.com ("Create new tag on publish"); the files are then added to that release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match VERSION $version" }
      - name: Qt 6.8
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtmultimedia
          aqtversion: "==3.3.0"
          cache: true
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure -LE ui
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          $out = "dist/Mapsmith-$version-windows"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/src/app/Release/Mapsmith.exe $out
          Copy-Item build/src/probe/Release/sme-probe.exe $out
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.txt $out
          Copy-Item build/_deps/sourcepp-src/LICENSE "$out/LICENSE_sourcepp.txt"
          Copy-Item build/_deps/sourcepp-src/THIRDPARTY_LEGAL_NOTICES.txt "$out/THIRD_PARTY_NOTICES_sourcepp.txt"
          windeployqt --release --no-translations --no-system-d3d-compiler "$out/Mapsmith.exe"
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"
          (Get-FileHash "$out.zip" -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path "$out.zip" -Leaf) | Out-File -Encoding ascii "$out.zip.sha256"
          # One installer exe (Inno Setup; preinstalled on the runner, else from Chocolatey with a fixed version).
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version 6.4.3 --no-progress -y; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path $out).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" installer/mapsmith.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setup = "dist/Mapsmith-Setup-$version.exe"
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $setup -Leaf) | Out-File -Encoding ascii "$setup.sha256"
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION).Trim()
          $tag = "${{ github.ref_name }}"
          $files = "dist/Mapsmith-Setup-$version.exe", "dist/Mapsmith-Setup-$version.exe.sha256",
                   "dist/Mapsmith-$version-windows.zip", "dist/Mapsmith-$version-windows.zip.sha256"
          # A release drafted on github.com (which creates the tag) keeps its text; only the files are added.
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Upload failed" }
            exit 0
          }
          # Otherwise the release text is the message of the (annotated) tag.
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          $notes = git tag -l --format='%(contents)' $tag
          if (-not $notes) { $notes = "Mapsmith $version" }
          Set-Content -Path notes.md -Value $notes -Encoding utf8
          gh release create $tag @files --repo "${{ github.repository }}" --title "Mapsmith $version" --notes-file notes.md
          if ($LASTEXITCODE -ne 0) { throw "Release failed" }
