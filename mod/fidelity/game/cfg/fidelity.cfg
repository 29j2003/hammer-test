// =============================================================================
// mapbase-fidelity - default settings
// Executed from autoexec.cfg ("exec fidelity"). Change values here to give the
// whole mod a different look or mix. On/off switches (r_fidelity_ssao,
// r_fidelity_ssao_quality, r_fidelity_godrays, r_fidelity_fxaa, r_fidelity_grade,
// r_fidelity_sharpen, r_fidelity_sunshadow, r_fidelity_projshadow,
// r_fidelity_exposure_smooth, r_fidelity_depth_fullres, r_fidelity_sunshadow_cascade, r_fidelity_sun_follow, snd_fidelity,
// snd_fidelity_occlusion, snd_fidelity_reverb, snd_fidelity_headroom, r_fidelity_wind, r_fidelity_glow,
// r_fidelity_glow_count, r_fidelity_glow_elights, r_fidelity_glow_distance, r_fidelity_muzzlelight, r_fidelity_sky,
// r_fidelity_sparklight, r_fidelity_weapon_wall, r_fidelity_weapon_wall_distance, r_fidelity_splatter,
// r_fidelity_dead_eyes, r_fidelity_volumetric, r_fidelity_volumetric_lights, r_fidelity_weapon_sway,
// snd_fidelity_shock, snd_fidelity_distant, r_fidelity_bloodpools, r_fidelity_muzzlesmoke,
// r_fidelity_impactdust, r_fidelity_rainsplash, r_fidelity_cubemaps, r_fidelity_flashes,
// r_fidelity_dynlights, r_fidelity_wetness, cl_fidelity_npc_blend)
// are saved in the player's config and are not set here on purpose.
// Lines starting with // are comments.
// =============================================================================

// ----------------------------------------------------------------- Lighting --
// Shadow map resolution of projected textures / flashlight / env_global_light.
// 2048 is the Mapbase default; 4096 gives clearly sharper shadows. Takes effect
// on the next map load.
r_flashlightdepthres 4096

// More render-to-texture (blob) shadows from models at the same time.
r_shadowmaxrendered 64

// Width of the soft edge of env_global_light sun shadows, in shadow map
// texels (on/off: r_fidelity_sunshadow). env_projectedtexture's own "Shadow
// Filter" keyvalue is in texels too (r_fidelity_projshadow).
r_fidelity_sunshadow_softness 1.2

// Glowing models (chargers, crossbow, Combine lights) and glow sprites on moving
// things (grenade blink, Manhack eyes) light their
// surroundings with a soft light of their colour (on/off: r_fidelity_glow,
// how many at once: r_fidelity_glow_count). Brightness and reach (1 = default).
r_fidelity_glow_brightness 1.0
r_fidelity_glow_radius 1.0

// Muzzle flashes light the world for a moment (on/off: r_fidelity_muzzlelight).
r_fidelity_muzzlelight_brightness 1.0

// Light in the air of the flashlight and of projected textures with shadows
// (on/off: r_fidelity_volumetric, how many lights: r_fidelity_volumetric_lights).
// How much the air scatters (0.0003 = clear .. 0.0015 = dusty) and from how far
// away lights show it.
r_fidelity_volumetric_density 0.0006
r_fidelity_volumetric_distance 1200
// Haze of the sun (shafts through windows, from its shadow map; 0 = none) and
// how far along the view it is gathered.
r_fidelity_volumetric_sun 0.00004
r_fidelity_volumetric_sun_reach 1500
// Mist near the ground: the haze is this much denser at the base (lit by the
// sun and the lights, with their shadows; 0 = none), thinning out over this
// many units upwards. The base is the floor where the map starts; a map can
// set its own height with r_fidelity_mist_base (point_clientcommand).
r_fidelity_mist 2
r_fidelity_mist_height 80
// Faint lens flare of the sun (0 = none).
r_fidelity_lensflare 0.1

// Muzzle flashes and explosions also light like the flashlight for a moment
// (bump maps, specular; on/off: r_fidelity_flashes). Their brightness:
r_fidelity_flashes_brightness 1.0
// The nearest dynamic lights also light the walls' relief and a highlight per
// pixel (on/off: r_fidelity_dynlights). How strongly:
r_fidelity_dynlights_strength 1.0
// In the rain, walls and floors open to the sky get wet, puddles gather in
// hollows (on/off: r_fidelity_wetness): seconds until wet through, until dry again.
r_fidelity_wetness_wet 25
r_fidelity_wetness_dry 120
// Water (deploy.bat sets it up; -NoWater keeps the game's): how brightly the sun
// glints on the waves (0 = no glint) and how much foam shows where it is
// shallow at the shore (0 = none, up to 2).
r_fidelity_water_glint 3.0
r_fidelity_water_foam 1.0

// -------------------------------------------------------------------- Sky ---
// Drifting clouds in the skybox, grey in the sky's own brightness, moving with
// the wind (env_wind or the breeze) as fast as it blows. On/off: r_fidelity_sky
// (next map load). How visible (0 = none), how much of the sky they cover
// (0.3 = a lot .. 0.7 = a few wisps), how dark their thick parts are, size
// (bigger = smaller clouds) and speed (times the wind).
r_fidelity_sky_clouds 0.85
r_fidelity_sky_clouds_coverage 0.38
r_fidelity_sky_clouds_darkness 0.5
r_fidelity_sky_clouds_scale 1.0
r_fidelity_sky_clouds_speed 1.0

// ----------------------------------------------------------------- Exposure --
// Automatic exposure (HDR eye adaptation; on/off: r_fidelity_exposure_smooth).
// Changes smaller than the dead zone (in stops) are ignored, so small head
// movements do not change the brightness. Seconds to adapt when the view gets
// brighter / darker. Maps limit the range with env_tonemap_controller.
r_fidelity_exposure_deadzone 0.2
r_fidelity_exposure_darken_time 0.5
r_fidelity_exposure_brighten_time 1.5

// No blur when turning the camera: it changes the look with every turn. The
// short blur when falling stays.
mat_motion_blur_rotation_intensity 0

// Lets maps use color_correction / color_correction_volume entities (LUTs).
mat_colorcorrection 1
// Sharper textures on floors and walls seen at an angle (anisotropic filtering, 16x)
mat_forceaniso 16
// Grass and other detail sprites further out, fading softly
cl_detaildist 2000
cl_detailfade 600
// Water reflects the world properly (not just the sky)
r_waterforceexpensive 1

// Weapons in the hand swing a little behind turns, lean when strafing and dip
// when landing (on/off: r_fidelity_weapon_sway). How much (1 = default, subtle).
r_fidelity_weapon_sway_scale 1.0

// ------------------------------------------------------------------- Wind ---
// Light breeze for swaying foliage in maps without env_wind (on/off:
// r_fidelity_wind). Strength (about env_wind speed / 25), direction it blows
// to in degrees, and how gusty it is (0..1). Maps with env_wind use their own.
r_fidelity_wind_strength 1.0
r_fidelity_wind_yaw 30
r_fidelity_wind_gusts 0.5

// -------------------------------------------------------------------- SSAO ---
// Radius of the occlusion in world units (a door frame is ~8, a crate ~32).
r_fidelity_ssao_radius 28
// Darkening strength. 0.8 = subtle, 1.6 = default (Julius: "Schatten pushen"), 2 = strong.
r_fidelity_ssao_strength 1.6
// How much directly lit, bright surfaces are spared (0 = not at all).
r_fidelity_ssao_lumaprotect 0.45
// Fade out with distance (in units). The engine only provides depth for about
// 512 units, so keep fade_end below 500.
r_fidelity_ssao_fade_start 300
r_fidelity_ssao_fade_end 460

// ------------------------------------------------------------ Light shafts --
// God rays from the map's env_sun or env_global_light (on/off is r_fidelity_godrays).
// Brightness of the shafts (2.4 made the sun a huge white glow, 1.5 and 1.25 still
// "viel zu stark", seemingly a second sun - Julius 25.10.2026).
r_fidelity_godrays_intensity 0.8
// How far towards the sun they reach (0..1) and how quickly they fade.
r_fidelity_godrays_length 0.85
r_fidelity_godrays_decay 0.94
// Only sky brighter than this casts shafts (0..1): only the sun and the bright
// sky right at it, not all of a bright sky (that gave a white disc around the
// sun). Lower it for dull skies.
r_fidelity_godrays_threshold 0.55
// Size of the glowing area around the sun, in screen heights (0.22 doubled the
// sky's brightness 0.1 screen heights off the sun: a second, bigger sun).
r_fidelity_godrays_radius 0.1
// Colour of the shafts (r g b), multiplied with the sky colour.
r_fidelity_godrays_tint "1.0 0.92 0.8"

// --------------------------------------------------------------------- Look --
r_fidelity_exposure 1.0
r_fidelity_clarity 0.35
r_fidelity_contrast 0.18
r_fidelity_saturation 1.0
r_fidelity_vibrance 0.2
// -1 = cold/blue .. 1 = warm/orange
r_fidelity_temperature 0
// -1 = magenta .. 1 = green
r_fidelity_tint 0
r_fidelity_lift 0
r_fidelity_gamma 1.0
r_fidelity_gain 1.0
r_fidelity_vignette 0.18
r_fidelity_vignette_radius 0.55
r_fidelity_vignette_softness 0.45

// -------------------------------------------------------------------- Audio --
// Engine: high quality pitch shifting and spatialize every sound every frame.
snd_pitchquality 1
snd_spatialize_roundrobin 0

// Category volumes (0..1)
snd_fidelity_vol_dialogue 1.0
snd_fidelity_vol_music 1.0
snd_fidelity_vol_ambience 0.9
snd_fidelity_vol_weapons 1.0
snd_fidelity_vol_player 0.85
snd_fidelity_vol_effects 1.0

// While someone talks: volume of the other categories (1 = no ducking)
snd_fidelity_duck_dialogue_music 0.45
snd_fidelity_duck_dialogue_ambience 0.55
snd_fidelity_duck_dialogue_effects 0.8
snd_fidelity_duck_dialogue_weapons 0.9
snd_fidelity_duck_attack 0.15
snd_fidelity_duck_release 0.9

// During combat (shots nearby, taking damage)
snd_fidelity_duck_combat_ambience 0.6
snd_fidelity_duck_combat_music 1.0
snd_fidelity_combat_hold 4.0
snd_fidelity_combat_release 2.5

// Keep big firefights clear: compress when many loud sounds overlap (on/off is
// snd_fidelity_headroom)
snd_fidelity_headroom_threshold 2.0
snd_fidelity_headroom_ratio 0.5
snd_fidelity_headroom_min 0.55

// Sounds behind walls are quieter (on/off is snd_fidelity_occlusion). The engine
// itself already lowers obscured sounds a little (snd_obscured_gain_dB); this
// comes on top.
// Volume of a sound fully behind a wall (0..1) and how fast it fades.
snd_fidelity_occlusion_gain 0.5
snd_fidelity_occlusion_attack 0.12
snd_fidelity_occlusion_release 0.25

// An explosion nearby numbs the ears for a moment, death fades the world out
// (on/off: snd_fidelity_shock). Volume right after a blast next to you, reach
// in units, seconds until the ears are back, volume once dead.
snd_fidelity_shock_gain 0.4
snd_fidelity_shock_reach 600
snd_fidelity_shock_release 2.0
snd_fidelity_death_gain 0.45

// Shots and explosions far away echo, delayed as sound is (on/off:
// snd_fidelity_distant; the sounds come from deploy.bat). Their volume.
snd_fidelity_distant_volume 0.7

// ------------------------------------------------------------------- Reverb --
// Automatic room reverb where the soundscape sets no "dsp" (on/off:
// snd_fidelity_reverb). Seconds a new room must stay the same before it is
// used; size limits in units; room types (scripts/dsp_presets.txt) per space:
// sky above (outside / courtyard), tunnel, or a room whose sound depends on what
// most surfaces are made of: concrete, metal, bright (tile, glass), soft (wood,
// dirt, grass).
snd_fidelity_reverb_delay 0.6
snd_fidelity_reverb_size_small 160
snd_fidelity_reverb_size_medium 448
snd_fidelity_reverb_size_large 1024
snd_fidelity_reverb_outside 1
snd_fidelity_reverb_small 18
snd_fidelity_reverb_medium 19
snd_fidelity_reverb_large 20
snd_fidelity_reverb_huge 21
snd_fidelity_reverb_courtyard 18
snd_fidelity_reverb_bright_small 12
snd_fidelity_reverb_bright_medium 13
snd_fidelity_reverb_bright_large 13
snd_fidelity_reverb_soft_small 17
snd_fidelity_reverb_soft_medium 18
snd_fidelity_reverb_soft_large 19
snd_fidelity_reverb_metal_small 3
snd_fidelity_reverb_metal_medium 4
snd_fidelity_reverb_metal_large 4
snd_fidelity_reverb_tunnel_small 5
snd_fidelity_reverb_tunnel_medium 6
snd_fidelity_reverb_tunnel_large 7

// ---- Combine soldiers (server; fidelity/fidelity_ai.h) ----------------------
// A little more like Half-Life 1's grunts: they go looking for a player who
// hid, and fall back when badly hurt. 0 = as Half-Life 2.
npc_fidelity_tactics 1
npc_fidelity_hunt_after 6
npc_fidelity_hunt_interval 8
npc_fidelity_fallback_health 0.4
npc_fidelity_fallback_interval 10
// Mapbase's own AI fixes, off in Mapbase to keep Half-Life 2 exactly as it was:
// enemy memory used where it should be, soldiers shoot from where their gun
// is, the whole squad learns when an enemy got away, and the crouched
// "protected" run under fire (only if the model has it).
ai_enemy_memory_fixes 1
npc_combine_fixed_shootpos 1
ai_squad_broadcast_elusion 1
npc_combine_protected_run 1

// ---- NPC gestures (server; fidelity/fidelity_animation.h) -------------------
// Reloading, signals, flinches, shooting while running: fade in and out
// instead of popping. 0 = as Half-Life 2.
npc_fidelity_gesture_blend 1
npc_fidelity_gesture_blend_in 0.15
npc_fidelity_gesture_blend_flinch 0.08
npc_fidelity_gesture_blend_out 0.25

// ---- NPC body animations (client; fidelity/fidelity_animation.cpp) ---------
// Changing from one body animation to the next (at ease -> flinch -> aiming)
// fades at least this long (on/off: cl_fidelity_npc_blend).
cl_fidelity_npc_blend_time 0.3
